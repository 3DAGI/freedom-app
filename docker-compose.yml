# FreedomStack Provider — alles in einem Paket
#
# WARUM ES DAS GIBT
# Der Installer setzt Ollama voraus und installiert es notfalls nach. Das
# funktioniert, verlangt aber Systemrechte, hinterlässt einen Dienst und
# scheitert auf jeder Distribution ein bisschen anders. Für jemanden, der nur
# ausprobieren will, ist das die Hürde, an der er abbricht.
#
# Hier läuft alles in Containern: ein Befehl, keine Systemänderung, und
# `docker compose down` entfernt es rückstandsfrei. Das ist die ehrlichere
# Einstiegsvariante — wer bleibt, kann später auf den Installer wechseln.
#
# START
#   NODE_LUD16=provider@knoten.example.org REGION=eu docker compose up -d
#   (deine eigene Lightning-Adresse – am besten beim eigenen Knoten, docs/PROVIDER.md)
#
# Ohne NODE_LUD16 startet der Knoten NICHT. Das ist Absicht: Ein Provider, der
# arbeitet und dessen Einnahmen nirgendwo ankommen, ist schlimmer als einer,
# der gar nicht erst startet.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: freedom-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Kein Port nach außen. Der Knoten erreicht Ollama über das interne Netz;
    # ein offener Inferenz-Endpunkt im Internet wäre eine Einladung.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            # Ohne GPU auskommentieren. Der Knoten läuft dann auf dem
            # Prozessor — langsam genug, dass kaum ein Kunde ihn wählt.
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lädt das Modell einmal und beendet sich. Ohne diesen Schritt wartet der
  # erste Kunde minutenlang auf einen Download, den er für Rechenzeit hält.
  model-pull:
    image: ollama/ollama:latest
    container_name: freedom-model-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL="${OLLAMA_MODEL:-qwen2.5:7b}"
        echo "Lade $$MODEL — das dauert beim ersten Mal einige Minuten."
        ollama pull "$$MODEL"
    restart: "no"

  node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    container_name: freedom-node
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment:
      # Pflicht. Fehlt sie, bricht der Knoten mit einer klaren Meldung ab.
      NODE_LUD16: "${NODE_LUD16:?NODE_LUD16 fehlt — ohne Auszahlungsadresse waere die Arbeit geschenkt}"
      REGION: "${REGION:-}"
      # B-40: Schluessel des Knotens. Leer: ~/.freedom/node-key im Volume freedom-state
      # (beim ersten Start angelegt, 0600) – so bleibt die Identitaet ueber Neustarts.
      NODE_SECRET_KEY: "${NODE_SECRET_KEY:-}"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      PROVIDER_MODELS: "${PROVIDER_MODELS:-qwen2.5:7b}"
      # B-29a: KI-Antrieb – ollama (Vorgabe) oder openai (vLLM, SGLang, TensorFold; docs/PROVIDER.md).
      # KI_URL mit /v1, nur dieser Rechner oder Heimnetz; KI_SCHLUESSEL nur, wenn der Dienst einen verlangt.
      KI_ANTRIEB: "${KI_ANTRIEB:-ollama}"
      KI_URL: "${KI_URL:-}"
      # B-29c1b: mit KI_ANTRIEB=openai laedt der Knoten von Hugging Face hierher (npm run modell -- <org/repo> --aus-hf).
      # Leer: ~/.freedom/modelle im Volume freedom-state – der Antrieb braucht denselben Ordner (nur lesend).
      MODELL_ORDNER: "${MODELL_ORDNER:-}"
      # B-29c2c: Modelle im Schwarm (aria2c im Image) – TORRENT=1 nur mit KI_ANTRIEB=openai. Wer teilt, zeigt
      # seine IP im Schwarm (docs/PROVIDER.md). Port TORRENT_PORT (TCP und UDP) unten bei ports freigeben.
      TORRENT: "${TORRENT:-0}"
      TORRENT_PORT: "${TORRENT_PORT:-6881}"
      TORRENT_HOCHLADEN_KBS: "${TORRENT_HOCHLADEN_KBS:-0}"
      KI_SCHLUESSEL: "${KI_SCHLUESSEL:-}"
      # 11.3d1a: Agent auf dem Knoten (offene Räume, wer fragt, zahlt) – eigener Schlüssel in ~/.freedom/agent-key
      KNOTEN_AGENT: "${KNOTEN_AGENT:-0}"
      AGENT_NAME: "${AGENT_NAME:-}"
      AGENT_ABOUT: "${AGENT_ABOUT:-}"
      AGENT_PERSONA: "${AGENT_PERSONA:-}"
      AGENT_MODELL: "${AGENT_MODELL:-}"
      AGENT_BESITZER: "${AGENT_BESITZER:-}"
      AGENT_PRIVAT: "${AGENT_PRIVAT:-}"
      # 11.5c2a: Repo-Aufträge – der Agent bearbeitet Code des Raums in der Sandbox (bubblewrap) und reicht
      # einen Patch ein. Unter Docker geht die Sandbox nur mit docker-compose.vibecoden.yml; sonst bleibt es aus
      AGENT_REPO: "${AGENT_REPO:-0}"
      # A-31 VKc1: Vibecoden auf dem eigenen Knoten – Projekte in ~/.freedom/projekte (Volume freedom-state),
      # nur für den gekoppelten Besitzer (docs/VIBECODEN-ENTWURF.md)
      VIBECODEN: "${VIBECODEN:-0}"
      # E9-3: Modelle geprueft laden (docker compose exec node npm run modell -- <name> --aus-registry,
      # docs/PROVIDER.md); passt es in den Speicher? Leer: Arbeitsspeicher des Rechners
      MODELL_SPEICHER_GB: "${MODELL_SPEICHER_GB:-}"
      # E9-4: Modellkataloge, denen der Knoten folgt (38080:<kurator>:<kennung>, mit Komma) – deren Manifeste
      # gelten neben dem eigenen. Leer: nur das eigene; ungueltig: der Knoten startet nicht
      MODELL_KATALOGE: "${MODELL_KATALOGE:-}"
      FREE_TOKENS_PER_DAY: "${FREE_TOKENS_PER_DAY:-2000}"
      # Gratis-Start (A-14): Budget des Knotens je Tag fuer alle zusammen, Grenze je Antwort,
      # Rechenarbeit einer Gratis-Anfrage. Leer = Vorgabe (100000 / 2000 / 16), GRATIS_TOKENS_TAG=0 schaltet ab.
      GRATIS_TOKENS_TAG: "${GRATIS_TOKENS_TAG:-}"
      GRATIS_TOKENS_JE_ANTWORT: "${GRATIS_TOKENS_JE_ANTWORT:-}"
      GRATIS_POW_BITS: "${GRATIS_POW_BITS:-}"
      STORAGE_ENABLED: "${STORAGE_ENABLED:-1}"
      # E9-2: bis zu dieser Groesse (MB) haelt der Knoten Dateien anderer gratis – leer: jede Groesse, 0: nichts
      STORAGE_GRATIS_MB: "${STORAGE_GRATIS_MB:-}"
      RELAY_ENABLED: "${RELAY_ENABLED:-0}"
      # Ein Relay ohne oeffentliche Adresse ist fuer das Netz unsichtbar —
      # deshalb hier standardmaessig aus, statt still nichts beizutragen.
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL:-}"
      # 8.4: nur von und an Schluessel mit Zugang (RELAY_ZUGANG: hex, kommagetrennt;
      # sonst ~/.freedom/relay-zugang.json). Umschlaege nur an angemeldete Empfaenger
      # (NIP-42) – seit 8.4c Standard (die App meldet sich an); 0 schaltet ab.
      RELAY_BESCHRAENKT: "${RELAY_BESCHRAENKT:-0}"
      RELAY_ZUGANG: "${RELAY_ZUGANG:-}"
      RELAY_UMSCHLAEGE_NUR_ANGEMELDET: "${RELAY_UMSCHLAEGE_NUR_ANGEMELDET:-1}"
      # 8.4b: Zugang zu kaufen (POST /zugang auf dem Relay-Port) – Sats ueber eine Rechnung
      # des eigenen LND (RELAY_LND_MACAROON: Pfad zu einer Macaroon NUR mit invoices:read/write,
      # dazu LND_REST), SOL an RELAY_SOL_ADRESSE (geprueft ueber SOLANA_RPC_URL). Leer = nicht zu kaufen.
      RELAY_ZUGANG_TAGE: "${RELAY_ZUGANG_TAGE:-30}"
      RELAY_PREIS_SATS: "${RELAY_PREIS_SATS:-}"
      RELAY_LND_MACAROON: "${RELAY_LND_MACAROON:-}"
      RELAY_PREIS_LAMPORTS: "${RELAY_PREIS_LAMPORTS:-}"
      RELAY_SOL_ADRESSE: "${RELAY_SOL_ADRESSE:-}"
      RELAY_MAX_EVENTS: "${RELAY_MAX_EVENTS:-100000}"
      # 4.3c: Zahlkanal (SOL) – nur mit ZAHLKANAL=1. Der Knoten haelt dafuer einen
      # Solana-Schluessel (SOLANA_KEYPAIR, im Volume ablegen) und loest Gutschriften
      # selbst ein; NODE_SOL_ADDRESS muss die Adresse dieses Schluessels sein. Solange
      # das Kanal-Programm nicht deployt ist (MENSCH), nimmt er keine Kanaele an.
      ZAHLKANAL: "${ZAHLKANAL:-0}"
      NODE_SOL_ADDRESS: "${NODE_SOL_ADDRESS:-}"
      SOLANA_KEYPAIR: "${SOLANA_KEYPAIR:-/home/node/.freedom/solana-kanal.json}"
      # 4.5a: Eingeloestes geht gebuendelt an die eigene Auszahlungsadresse (deren
      # Schluessel NICHT auf dem Knoten liegt) – hoechstens einmal je Abstand und nur
      # ueber der Schwelle; die Ruecklage bleibt fuer Miete und Gebuehren. Leer: aus.
      # Laufen LP oder Relayer mit demselben SOLANA_KEYPAIR, bleibt sie aus.
      # 8.2a: Ob der Knoten in beiden Schienen verdienen kann, steht beim Start im
      # Log ([einrichtung]); erneut: docker compose exec node npm run pruefen
      NODE_SOL_PAYOUT: "${NODE_SOL_PAYOUT:-}"
      KANAL_AUSZAHLUNG_SCHWELLE_LAMPORTS: "${KANAL_AUSZAHLUNG_SCHWELLE_LAMPORTS:-100000000}"
      KANAL_AUSZAHLUNG_RUECKLAGE_LAMPORTS: "${KANAL_AUSZAHLUNG_RUECKLAGE_LAMPORTS:-10000000}"
      # RM2b2: Cashu-Pfand (Lightning-Sitzungen) – nur mit PFAND=1 und PFAND_MINTS (https,
      # mit Komma; nur Mints mit NUT-11/12, die die Frist richtig umsetzen – vorher pruefen).
      # Die Kasse liegt in ~/.freedom/pfand.json (Volume). Mit TOR_SOCKS gehen die Anfragen an die
      # Mints durch Tor (RM2b3); der Erloes geht ab 1000 sat an NODE_LUD16.
      PFAND: "${PFAND:-0}"
      PFAND_MINTS: "${PFAND_MINTS:-}"
      KANAL_AUSZAHLUNG_ABSTAND_SEK: "${KANAL_AUSZAHLUNG_ABSTAND_SEK:-86400}"
      # 8.2b: Lightning-Adresse beim eigenen LND statt bei einem verwahrenden Dienst
      # (docs/PROVIDER.md) – Macaroon nur mit invoices:read/write, Reverse-Proxy mit TLS.
      # 8.2c: Relays über Tor – host:port eines Tor-SOCKS-Proxys (z. B. ein eigener
      # Tor-Container). Ungültig: der Knoten startet nicht. Leer: ohne Tor.
      TOR_SOCKS: "${TOR_SOCKS:-}"
      # 7.4b2/7.5d: Funk-Gateway (docs/PROVIDER.md) – meshtastic:<ip> fuer ein
      # Meshtastic-Geraet mit WLAN, host:port fuer eine TCP-Bruecke. Leer: aus.
      # B-32d2: rnode:host:port fuer eine RNode hinter einer TCP-Bruecke (Reticulum) –
      # dann RETICULUM_REGION Pflicht (eu-869, eu-433), RETICULUM_WERTE frei
      # (Frequenz Hz, Bandbreite Hz, SF, CR, dBm – nur in den Grenzen der Region).
      FUNK_GATEWAY: "${FUNK_GATEWAY:-}"
      RETICULUM_REGION: "${RETICULUM_REGION:-}"
      RETICULUM_WERTE: "${RETICULUM_WERTE:-}"
      LNURL_ENABLED: "${LNURL_ENABLED:-0}"
      LNURL_BASE_URL: "${LNURL_BASE_URL:-}"
      LNURL_NAME: "${LNURL_NAME:-provider}"
      LNURL_LND_MACAROON: "${LNURL_LND_MACAROON:-}"
      # B-13: Zugaenge zum TURN fuer Anrufe (Profil „anrufe“ unten) – beide aus
      # scripts/turn-einrichten.sh; leer: keine Zugaenge.
      TURN_URLS: "${TURN_URLS:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      # B-34a: Zugaenge zum SFU fuer Gruppenanrufe (Profil „livekit“ unten) – alle drei aus
      # scripts/livekit-einrichten.sh; leer: keine Zugaenge.
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      QUOTA_API_PORT: "3602"
    volumes:
      # Identitaet (node-key, B-40) und Bootstrap-Zeitpunkt ueberleben Neustarts. Ohne
      # dieses Volume (und ohne NODE_SECRET_KEY) entsteht nach jedem Neubau des Containers
      # ein neuer Schluessel — Reputation weg, Gratisphase zurueck auf Anfang.
      - freedom-state:/home/node/.freedom
      - freedom-data:/home/node/freedom-data
      # Wissen ohne Internet (B-31b): ZIM-Dateien nur lesend einbinden und in ~/.freedom/mcp.json nennen, z. B.
      #   - ./zim:/daten/zim:ro      und  { "server": { "wiki": { "kiwix": ["/daten/zim/wikipedia_de_all_nopic.zim"] } } }
    ports:
      - "127.0.0.1:3602:3602"
      - "127.0.0.1:3601:3601"   # LNURL (8.2b), nur für den Reverse-Proxy
      # Schwarm (B-29c2c): mit TORRENT=1 hier TORRENT_PORT freigeben, sonst teilt der Knoten nur ausgehend, z. B.
      #   - "6881:6881/tcp"
      #   - "6881:6881/udp"

  # Anrufe (B-13b, T2 A): TURN-Vermittler, nur mit dem Profil „anrufe“. Einmal einrichten:
  #   bash scripts/turn-einrichten.sh ./turnserver.conf <oeffentlicher-name> --docker >> .env
  #   docker compose --profile anrufe up -d
  # Die Datei ist nur fuer dich lesbar (0600) – der Container laeuft deshalb als du (TURN_UID/GID).
  # Freigeben: UDP und TCP 3478, UDP 49160-49200. Zugaenge vergibt nur der Knoten.
  coturn:
    image: coturn/coturn:4.18
    container_name: freedom-coturn
    profiles: ["anrufe"]
    restart: unless-stopped
    network_mode: host
    # Standard 1000 (erster Nutzer); sonst die Zeilen aus --docker in .env. Ein „:?“ hier braeche jedes `up`.
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

  # Gruppenanrufe (B-34a, LK2–LK4 A): SFU, nur mit dem Profil „livekit“. Einmal einrichten:
  #   bash scripts/livekit-einrichten.sh ./livekit.yaml <oeffentlicher-name> --docker >> .env
  #   docker compose --profile livekit up -d
  # Das Signal hoert nur auf 127.0.0.1:7880 – davor ein Reverse-Proxy mit TLS (wss://<name>).
  # Freigeben: TCP 7881, UDP 50000-50100. Zugaenge vergibt nur der Knoten; die Datei ist 0600 (LIVEKIT_UID/GID).
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: freedom-livekit
    profiles: ["livekit"]
    restart: unless-stopped
    network_mode: host
    user: "${LIVEKIT_UID:-1000}:${LIVEKIT_GID:-1000}"
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  ollama-models:
  freedom-state:
  freedom-data:
