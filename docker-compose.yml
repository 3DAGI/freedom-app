# FreedomStack Provider — alles in einem Paket
#
# WARUM ES DAS GIBT
# Der Installer setzt Ollama voraus und installiert es notfalls nach. Das
# funktioniert, verlangt aber Systemrechte, hinterlässt einen Dienst und
# scheitert auf jeder Distribution ein bisschen anders. Für jemanden, der nur
# ausprobieren will, ist das die Hürde, an der er abbricht.
#
# Hier läuft alles in Containern: ein Befehl, keine Systemänderung, und
# `docker compose down` entfernt es rückstandsfrei. Das ist die ehrlichere
# Einstiegsvariante — wer bleibt, kann später auf den Installer wechseln.
#
# START
#   NODE_LUD16=du@wallet.cash REGION=eu docker compose up -d
#
# Ohne NODE_LUD16 startet der Knoten NICHT. Das ist Absicht: Ein Provider, der
# arbeitet und dessen Einnahmen nirgendwo ankommen, ist schlimmer als einer,
# der gar nicht erst startet.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: freedom-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Kein Port nach außen. Der Knoten erreicht Ollama über das interne Netz;
    # ein offener Inferenz-Endpunkt im Internet wäre eine Einladung.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            # Ohne GPU auskommentieren. Der Knoten läuft dann auf dem
            # Prozessor — langsam genug, dass kaum ein Kunde ihn wählt.
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lädt das Modell einmal und beendet sich. Ohne diesen Schritt wartet der
  # erste Kunde minutenlang auf einen Download, den er für Rechenzeit hält.
  model-pull:
    image: ollama/ollama:latest
    container_name: freedom-model-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL="${OLLAMA_MODEL:-qwen2.5:7b}"
        echo "Lade $$MODEL — das dauert beim ersten Mal einige Minuten."
        ollama pull "$$MODEL"
    restart: "no"

  node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    container_name: freedom-node
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment:
      # Pflicht. Fehlt sie, bricht der Knoten mit einer klaren Meldung ab.
      NODE_LUD16: "${NODE_LUD16:?NODE_LUD16 fehlt — ohne Auszahlungsadresse waere die Arbeit geschenkt}"
      REGION: "${REGION:-}"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      PROVIDER_MODELS: "${PROVIDER_MODELS:-qwen2.5:7b}"
      FREE_TOKENS_PER_DAY: "${FREE_TOKENS_PER_DAY:-2000}"
      STORAGE_ENABLED: "${STORAGE_ENABLED:-1}"
      RELAY_ENABLED: "${RELAY_ENABLED:-0}"
      # Ein Relay ohne oeffentliche Adresse ist fuer das Netz unsichtbar —
      # deshalb hier standardmaessig aus, statt still nichts beizutragen.
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL:-}"
      # 8.4: nur von und an Schluessel mit Zugang (RELAY_ZUGANG: hex, kommagetrennt;
      # sonst ~/.freedom/relay-zugang.json). Umschlaege nur an angemeldete Empfaenger
      # (NIP-42) – seit 8.4c Standard (die App meldet sich an); 0 schaltet ab.
      RELAY_BESCHRAENKT: "${RELAY_BESCHRAENKT:-0}"
      RELAY_ZUGANG: "${RELAY_ZUGANG:-}"
      RELAY_UMSCHLAEGE_NUR_ANGEMELDET: "${RELAY_UMSCHLAEGE_NUR_ANGEMELDET:-1}"
      # 8.4b: Zugang zu kaufen (POST /zugang auf dem Relay-Port) – Sats ueber eine Rechnung
      # des eigenen LND (RELAY_LND_MACAROON: Pfad zu einer Macaroon NUR mit invoices:read/write,
      # dazu LND_REST), SOL an RELAY_SOL_ADRESSE (geprueft ueber SOLANA_RPC_URL). Leer = nicht zu kaufen.
      RELAY_ZUGANG_TAGE: "${RELAY_ZUGANG_TAGE:-30}"
      RELAY_PREIS_SATS: "${RELAY_PREIS_SATS:-}"
      RELAY_LND_MACAROON: "${RELAY_LND_MACAROON:-}"
      RELAY_PREIS_LAMPORTS: "${RELAY_PREIS_LAMPORTS:-}"
      RELAY_SOL_ADRESSE: "${RELAY_SOL_ADRESSE:-}"
      RELAY_MAX_EVENTS: "${RELAY_MAX_EVENTS:-100000}"
      # 4.3c: Zahlkanal (SOL) – nur mit ZAHLKANAL=1. Der Knoten haelt dafuer einen
      # Solana-Schluessel (SOLANA_KEYPAIR, im Volume ablegen) und loest Gutschriften
      # selbst ein; NODE_SOL_ADDRESS muss die Adresse dieses Schluessels sein. Solange
      # das Kanal-Programm nicht deployt ist (MENSCH), nimmt er keine Kanaele an.
      ZAHLKANAL: "${ZAHLKANAL:-0}"
      NODE_SOL_ADDRESS: "${NODE_SOL_ADDRESS:-}"
      SOLANA_KEYPAIR: "${SOLANA_KEYPAIR:-/home/node/.freedom/solana-kanal.json}"
      # 4.5a: Eingeloestes geht gebuendelt an die eigene Auszahlungsadresse (deren
      # Schluessel NICHT auf dem Knoten liegt) – hoechstens einmal je Abstand und nur
      # ueber der Schwelle; die Ruecklage bleibt fuer Miete und Gebuehren. Leer: aus.
      # Laufen LP oder Relayer mit demselben SOLANA_KEYPAIR, bleibt sie aus.
      # 8.2a: Ob der Knoten in beiden Schienen verdienen kann, steht beim Start im
      # Log ([einrichtung]); erneut: docker compose exec node npm run pruefen
      NODE_SOL_PAYOUT: "${NODE_SOL_PAYOUT:-}"
      KANAL_AUSZAHLUNG_SCHWELLE_LAMPORTS: "${KANAL_AUSZAHLUNG_SCHWELLE_LAMPORTS:-100000000}"
      KANAL_AUSZAHLUNG_RUECKLAGE_LAMPORTS: "${KANAL_AUSZAHLUNG_RUECKLAGE_LAMPORTS:-10000000}"
      KANAL_AUSZAHLUNG_ABSTAND_SEK: "${KANAL_AUSZAHLUNG_ABSTAND_SEK:-86400}"
      # 8.2b: Lightning-Adresse beim eigenen LND statt bei einem verwahrenden Dienst
      # (docs/PROVIDER.md) – Macaroon nur mit invoices:read/write, Reverse-Proxy mit TLS.
      # 8.2c: Relays über Tor – host:port eines Tor-SOCKS-Proxys (z. B. ein eigener
      # Tor-Container). Ungültig: der Knoten startet nicht. Leer: ohne Tor.
      TOR_SOCKS: "${TOR_SOCKS:-}"
      LNURL_ENABLED: "${LNURL_ENABLED:-0}"
      LNURL_BASE_URL: "${LNURL_BASE_URL:-}"
      LNURL_NAME: "${LNURL_NAME:-provider}"
      LNURL_LND_MACAROON: "${LNURL_LND_MACAROON:-}"
      # B-13: Zugaenge zum TURN fuer Anrufe (Profil „anrufe“ unten) – beide aus
      # scripts/turn-einrichten.sh; leer: keine Zugaenge.
      TURN_URLS: "${TURN_URLS:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      QUOTA_API_PORT: "3602"
    volumes:
      # Identitaet und Bootstrap-Zeitpunkt ueberleben Neustarts. Ohne dieses
      # Volume erzeugt jeder Neustart einen neuen Schluessel — Reputation weg,
      # Gratisphase zurueck auf Anfang.
      - freedom-state:/home/node/.freedom
      - freedom-data:/home/node/freedom-data
    ports:
      - "127.0.0.1:3602:3602"
      - "127.0.0.1:3601:3601"   # LNURL (8.2b), nur für den Reverse-Proxy

  # Anrufe (B-13b, T2 A): TURN-Vermittler, nur mit dem Profil „anrufe“. Einmal einrichten:
  #   bash scripts/turn-einrichten.sh ./turnserver.conf <oeffentlicher-name> --docker >> .env
  #   docker compose --profile anrufe up -d
  # Die Datei ist nur fuer dich lesbar (0600) – der Container laeuft deshalb als du (TURN_UID/GID).
  # Freigeben: UDP und TCP 3478, UDP 49160-49200. Zugaenge vergibt nur der Knoten.
  coturn:
    image: coturn/coturn:4.18
    container_name: freedom-coturn
    profiles: ["anrufe"]
    restart: unless-stopped
    network_mode: host
    # Standard 1000 (erster Nutzer); sonst die Zeilen aus --docker in .env. Ein „:?“ hier braeche jedes `up`.
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  ollama-models:
  freedom-state:
  freedom-data:
