[package]
name = "freedom-launcher"
version = "0.1.0"
description = "FreedomStack Desktop Launcher: 1-Klick Provider-Knoten"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
