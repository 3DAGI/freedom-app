[package]
name = "freedom-launcher"
version = "0.1.0"
description = "FreedomStack als Desktop-App: eine Hülle um freedom.html (6.1a)"
edition = "2021"
rust-version = "1.90"
publish = false

# Desktop startet über main.rs, Android lädt die Bibliothek (6.1c)
[lib]
name = "freedom_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 6.1a3: Signaturen der Release-Manifeste (BIP-340) selbst prüfen – freigegeben 07.10.2026
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 6.1b1a: Tor in der Hülle – arti freigegeben 07.10.2026 (Desktop, seit 6.1b2a auch Android)
[target.'cfg(not(target_os = "ios"))'.dependencies]
arti-client = { version = "=0.46.0", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "onion-service-client"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
# rustls (über arti) braucht einen Krypto-Anbieter, den das Programm festlegt – ring steckt schon darin
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# 6.1b2a: den Proxy der WebViews setzt unter Android nur androidx.webkit – über JNI (steckt schon in wry)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Kein `panic = "abort"`: Ein Fehler in arti darf die Hülle nicht reißen (netz.rs,
# `catch_unwind` und eigene Aufgaben) – mit „abort“ endete die App bei jedem Start mit Tor.
