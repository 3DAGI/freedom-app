[package]
name = "freedom-launcher"
version = "0.1.0"
description = "FreedomStack als Desktop-App: eine Hülle um freedom.html (6.1a)"
edition = "2021"
rust-version = "1.90"
publish = false

# Desktop startet über main.rs, Android lädt die Bibliothek (6.1c)
[lib]
name = "freedom_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 6.1a3: Signaturen der Release-Manifeste (BIP-340) selbst prüfen – freigegeben 07.10.2026
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
