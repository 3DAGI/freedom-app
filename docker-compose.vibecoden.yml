# Vibecoden auf dem eigenen Knoten unter Docker (VKc3b, docs/PROVIDER.md „Vibecoden“):
#   docker compose -f docker-compose.yml -f docker-compose.vibecoden.yml up -d --build
# Baut Hermes ins Bild (VIBECODEN=1) und erlaubt dem Container, was bubblewrap für die Sandbox braucht:
# - seccomp: das Standardprofil von Docker plus Namensräume (clone, unshare, mount, umount2, pivot_root,
#   setns, sethostname) – die Sandbox legt darin ihren eigenen, engeren Filter an;
# - systempaths=unconfined: ein frisches /proc in der Sandbox geht nur, wenn Docker /proc nicht verdeckt;
# - apparmor=unconfined: das Profil docker-default (Ubuntu, DGX OS) verbietet mount.
# Der Knoten läuft weiter als Nutzer ohne Fähigkeiten; ohne diese Datei bleibt alles wie bisher.
services:
  node:
    build:
      args:
        VIBECODEN: "1"
        # Windows-Programme im Bild (VKi1): WINE=1 baut Wine und mingw-w64 dazu – nur amd64, rund 1,2 GB
        WINE: "${WINE:-0}"
        # Schaltpläne im Bild (VKk4b): KICAD=1 baut KiCad mit Symbolen und Footprints dazu, rund 700 MB
        KICAD: "${KICAD:-0}"
        # Szenen im Bild (VKk4c): BLENDER=1 baut Blender dazu, rund 400 MB
        BLENDER: "${BLENDER:-0}"
        # Dokumente im Bild (VKk4d): LIBREOFFICE=1 baut LibreOffice dazu (Writer, Calc, Impress, Draw), rund 400 MB
        LIBREOFFICE: "${LIBREOFFICE:-0}"
        # Zeichnungen im Bild (VKk4e): INKSCAPE=1 baut Inkscape dazu, rund 200 MB
        INKSCAPE: "${INKSCAPE:-0}"
        # Bilder im Bild (VKk4f): GIMP=1 baut GIMP dazu, rund 250 MB
        GIMP: "${GIMP:-0}"
        # Karten im Bild (VKk4g): QGIS=1 baut QGIS mit GDAL, PROJ und PyQGIS dazu, bis zu 900 MB
        QGIS: "${QGIS:-0}"
        # Videos im Bild (VKk4h): SHOTCUT=1 baut Shotcut und melt dazu, einige hundert MB
        SHOTCUT: "${SHOTCUT:-0}"
        # Partituren im Bild (VKk4i): MUSESCORE=1 baut MuseScore 3 dazu, rund 100 MB
        MUSESCORE: "${MUSESCORE:-0}"
        # Gemälde im Bild (VKk4j): KRITA=1 baut Krita dazu, rund 300 MB
        KRITA: "${KRITA:-0}"
        # Java-Projekte (VKh2a): GRADLE=1 baut das JDK 17 und Gradle dazu, rund 420 MB – Bibliotheken über den Spiegel (VKh1)
        GRADLE: "${GRADLE:-0}"
        # Android-Apps (VKh2b): ANDROID=1 baut das Android-SDK dazu (braucht GRADLE=1), rund 300 MB, bisher nur auf amd64 nutzbar.
        # Das SDK steht unter dem Lizenzvertrag von Google (https://developer.android.com/studio/terms) – nur wer ihn annimmt,
        # setzt ANDROID_SDK_LIZENZ=angenommen; sonst bricht der Bau ab. Ein Bild mit SDK nicht weitergeben.
        ANDROID: "${ANDROID:-0}"
        ANDROID_SDK_LIZENZ: "${ANDROID_SDK_LIZENZ:-}"
    environment:
      VIBECODEN: "1"
      # Modell für Code-Läufe (Tool-Calling, langer Kontext) – leer: das erste im Angebot
      CODE_MODELL: "${CODE_MODELL:-}"
      # Vorschau wie Replit (VKg1a): die Adresse, unter der dein Handy den Knoten erreicht, z. B.
      # http://192.168.1.20:3603 – leer: keine Vorschau. Port 3603, nie der Port der App (7777).
      VORSCHAU_URL: "${VORSCHAU_URL:-}"
      # Bildstrom (VKg2): coturn läuft mit dem Profil „anrufe“ im Netz des Rechners – aus diesem Container erreicht der
      # Knoten ihn über host.docker.internal:3478 (unten), wenn der öffentliche Name von innen nicht geht. Leer: TURN_URLS.
      TURN_INTERN: "${TURN_INTERN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # nur für Tor oder einen Reverse-Proxy auf diesem Rechner: VORSCHAU_BIND=127.0.0.1
      - "${VORSCHAU_BIND:-0.0.0.0}:3603:3603"
    security_opt:
      - seccomp=docker/seccomp-vibecoden.json
      - systempaths=unconfined
      - apparmor=unconfined
