# Desktop-Hülle (6.1a, Entscheidung N2): baut packages/launcher (Tauri 2) unter
# Linux und Windows und fuehrt ihre Tests aus. Die Hülle legt freedom.html bei –
# deshalb laeuft der Job auch, wenn sich die App aendert. Seit 6.1a4a baut er
# Pakete zum Testen auf Geraeten (deb, AppImage, Installer fuer Windows) und legt
# sie mit Pruefsummen als Artefakt des Laufs ab – unsigniert und kein Release:
# veroeffentlicht wird nichts (das Selbst-Update der Hülle folgt mit 6.1a4b).
# Seit 6.1c auch Android: ein APK fuer arm64, signiert mit einem Wegwerf-Schluessel,
# der nur in diesem Lauf entsteht – zum Testen, kein Release.
# Seit 6.1c2a (Freigabe MENSCH 08.10.2026) auch Linux arm64 und ein Release zum
# Herunterladen: nur ueber „Run workflow“ mit Haken „veroeffentlichen“ auf main
# (Job unten). Feste Dateinamen, auf die die Website zeigt; Desktop unsigniert,
# das APK nur mit dem festen Schluessel aus den Secrets – ohne ihn kein APK.

name: Desktop-Hülle

on:
  push:
    branches: [main]
    paths: ["packages/launcher/**", "packages/app/**", "packages/protocol/src/**", "scripts/launcher-symbole.py", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["packages/launcher/**", "packages/app/**", "packages/protocol/src/**", "scripts/launcher-symbole.py", ".github/workflows/launcher.yml"]
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Release zum Herunterladen veröffentlichen (nur main)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bauen:
    name: Hülle bauen und testen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: App bauen (wird beigelegt)
        shell: bash
        run: |
          npm install --workspaces --include-workspace-root --no-audit --no-fund
          cd packages/app && node build.mjs && test -f dist/freedom.html
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Systempakete fuer WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Rust (falls das Abbild keins hat)
        shell: bash
        run: |
          if ! command -v cargo > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Symbole passen zum Logo
        shell: bash
        run: python3 scripts/launcher-symbole.py --pruefen

      - name: Rust zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
            packages/launcher/target
          key: launcher-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/launcher/Cargo.lock') }}

      - name: Tests
        working-directory: packages/launcher
        run: cargo test --locked

      - name: Bauen (Release)
        working-directory: packages/launcher
        run: cargo build --release --locked

      - name: tauri-cli (Tauri 2)
        shell: bash
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -q '^tauri-cli 2\.'; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Pakete bauen
        working-directory: packages/launcher
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then B=deb,appimage; else B=nsis; fi
          cargo tauri build --bundles "$B" -- --locked

      - name: Pruefsummen
        working-directory: packages/launcher/target/release/bundle
        shell: bash
        run: |
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' \) -print0 \
            | sort -z | xargs -0 sha256sum | sed 's#[ *]\./# #' > SHA256SUMS
          cat SHA256SUMS
          test -s SHA256SUMS

      - name: Pakete ablegen (Artefakt, kein Release)
        uses: actions/upload-artifact@v4
        with:
          name: freedom-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            packages/launcher/target/release/bundle/SHA256SUMS
            packages/launcher/target/release/bundle/deb/*.deb
            packages/launcher/target/release/bundle/appimage/*.AppImage
            packages/launcher/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android-APK bauen (Test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.3.13750724"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: App bauen (wird beigelegt)
        run: |
          npm install --workspaces --include-workspace-root --no-audit --no-fund
          cd packages/app && node build.mjs && test -f dist/freedom.html
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-NDK (fester Stand)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            packages/launcher/target
          key: launcher-android-${{ hashFiles('packages/launcher/Cargo.lock') }}

      - name: tauri-cli (Tauri 2)
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -q '^tauri-cli 2\.'; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Android-Projekt erzeugen, eigene Symbole, Keep-Regel fuer androidx.webkit
        working-directory: packages/launcher
        run: |
          cargo tauri android init --ci
          python3 ../../scripts/launcher-symbole.py --android
          cp proguard-tor.pro gen/android/app/freedom-tor.pro

      - name: APK bauen (arm64)
        working-directory: packages/launcher
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: Pruefen – Proxy-Klassen fuer Tor im APK (6.1b2a, nur ueber JNI gerufen)
        working-directory: packages/launcher/gen/android/app/build/outputs/apk/universal/release
        run: |
          rm -rf dex && mkdir dex && unzip -q app-universal-release-unsigned.apk 'classes*.dex' -d dex
          for k in 'Landroidx/webkit/ProxyController;' 'Landroidx/webkit/ProxyConfig$Builder;' 'Landroidx/webkit/WebViewFeature;'; do
            grep -q -a -F "$k" dex/classes*.dex || { echo "fehlt im APK: $k"; exit 1; }
          done
          rm -rf dex

      - name: Signieren mit Wegwerf-Schluessel (nur dieser Lauf)
        working-directory: packages/launcher/gen/android/app/build/outputs/apk/universal/release
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          PW="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          keytool -genkeypair -keystore "$RUNNER_TEMP/wegwerf.jks" -storepass "$PW" -keypass "$PW" -alias test \
            -keyalg EC -groupname secp256r1 -validity 30 -dname "CN=FreedomStack Test (je Lauf neu)" 2> /dev/null
          "$BT/zipalign" -P 16 -f 4 app-universal-release-unsigned.apk ausgerichtet.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/wegwerf.jks" --ks-pass "pass:$PW" --out freedom-android-arm64-test.apk ausgerichtet.apk
          rm -f "$RUNNER_TEMP/wegwerf.jks" ausgerichtet.apk  # das unsignierte bleibt – fuer den festen Schluessel im Release
          "$BT/apksigner" verify --print-certs freedom-android-arm64-test.apk | head -2
          sha256sum freedom-android-arm64-test.apk > SHA256SUMS
          cat SHA256SUMS

      - name: APK ablegen (Artefakt, kein Release)
        uses: actions/upload-artifact@v4
        with:
          name: freedom-android
          path: |
            packages/launcher/gen/android/app/build/outputs/apk/universal/release/freedom-android-arm64-test.apk
            packages/launcher/gen/android/app/build/outputs/apk/universal/release/SHA256SUMS
            packages/launcher/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  # Release zum Herunterladen (6.1c2a): nur von Hand („Run workflow“, Haken
  # „veroeffentlichen“) und nur auf main – wie der Spiegel in pages.yml. Die
  # Secrets des festen Android-Schluessels gibt es nur im Schritt, der signiert;
  # ohne sie kommt das Release ohne APK (nie mit dem Wegwerf-Schluessel).
  veroeffentlichen:
    name: Release veroeffentlichen (von Hand, nur main)
    if: github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen && github.ref == 'refs/heads/main'
    needs: [bauen, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefakte

      - name: Pakete pruefen und fest benennen
        run: |
          set -euo pipefail
          for d in artefakte/freedom-desktop-*; do (cd "$d" && sha256sum -c --quiet SHA256SUMS); done
          mkdir release
          nimm() {
            mapfile -t t < <(find "artefakte/$1" -type f -name "$2")
            [ "${#t[@]}" = 1 ] || { echo "nicht genau eine Datei: $1/$2"; exit 1; }
            cp "${t[0]}" "release/$3"
          }
          nimm freedom-desktop-Linux-X64 '*.AppImage' freedom-linux-x64.AppImage
          nimm freedom-desktop-Linux-X64 '*.deb' freedom-linux-x64.deb
          nimm freedom-desktop-Linux-ARM64 '*.AppImage' freedom-linux-arm64.AppImage
          nimm freedom-desktop-Linux-ARM64 '*.deb' freedom-linux-arm64.deb
          nimm freedom-desktop-Windows-X64 '*-setup.exe' freedom-windows-x64-setup.exe

      - name: APK mit dem festen Schluessel signieren (nur hier)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::Kein fester Android-Schluessel in den Secrets – das Release kommt ohne APK."
            exit 0
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/fest.jks"
          "$BT/zipalign" -P 16 -f 4 artefakte/freedom-android/app-universal-release-unsigned.apk "$RUNNER_TEMP/ausgerichtet.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/fest.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --v4-signing-enabled false --out release/freedom-android-arm64.apk "$RUNNER_TEMP/ausgerichtet.apk"
          rm -f "$RUNNER_TEMP/fest.jks" "$RUNNER_TEMP/ausgerichtet.apk"
          "$BT/apksigner" verify --print-certs release/freedom-android-arm64.apk | grep 'SHA-256' | tee "$RUNNER_TEMP/zertifikat.txt"

      - name: Pruefsummen und Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("packages/launcher/tauri.conf.json"))["version"])')"
          TAG="app-v$VERSION-$GITHUB_RUN_NUMBER"
          (cd release && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS") && mv "$RUNNER_TEMP/SHA256SUMS" release/
          {
            echo "Vorschau der App als eigenes Programm (Hülle $VERSION, Commit $GITHUB_SHA)."
            echo
            echo "- Linux (x64, arm64) und Windows: unsigniert – Windows warnt beim Installieren. Vorher die Summe mit SHA256SUMS vergleichen."
            if [ -f release/freedom-android-arm64.apk ]; then
              echo "- Android (arm64): signiert mit dem festen Schlüssel des Projekts – $(cut -d: -f2- "$RUNNER_TEMP/zertifikat.txt" | tr -d ' ')."
            else
              echo "- Android: noch nicht – es fehlt der feste Schlüssel."
            fi
            echo "- Neue Versionen: neu herunterladen und darüber installieren; Daten bleiben."
            echo
            echo "Preview of the app as its own program. Desktop builds are unsigned; compare the checksum with SHA256SUMS first."
          } > "$RUNNER_TEMP/notizen.md"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --latest \
            --title "FreedomStack $VERSION – Vorschau (Lauf $GITHUB_RUN_NUMBER)" --notes-file "$RUNNER_TEMP/notizen.md"
