# Veroeffentlicht die Website mit der App auf GitHub Pages.
#
# Bei jedem Push auf main: App bauen, Tests laufen lassen, Website-Ordner
# zusammenstellen (scripts/build-site.sh), veroeffentlichen. Schlaegt ein Test
# fehl, wird nichts veroeffentlicht — eine kaputte App geht nicht raus.
#
# Einmalig einrichten: Repository -> Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - name: Tests
        run: |
          (cd packages/protocol && npm test)
          (cd packages/app && npm test)
      - name: Website zusammenstellen
        run: scripts/build-site.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
