# Veroeffentlicht die Website mit der App auf GitHub Pages.
#
# Bei jedem Push auf main: App bauen, Tests laufen lassen, Website-Ordner
# zusammenstellen (scripts/build-site.sh), veroeffentlichen. Schlaegt ein Test
# fehl, wird nichts veroeffentlicht — eine kaputte App geht nicht raus.
#
# Einmalig einrichten: Repository -> Settings -> Pages -> Source: "GitHub Actions".
#
# Spiegel (5.3b): Nur beim Release – Actions -> pages -> "Run workflow" mit
# "spiegeln" – laedt der Job "spiegel" die eben veroeffentlichte freedom.html zu
# den Spiegeln hoch (Konten: docs/KONTEN.md). Fehlt ein Secret, wird dieser
# Spiegel mit Hinweis uebersprungen. Das Ergebnis ist das Artefakt
# "spiegel-ergebnis" fuer publish-release.mjs.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spiegeln:
        description: "Release: zu den Spiegeln hochladen (IPFS, Blossom, Arweave, Codeberg)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Dieselbe Node-Hauptversion wie der reproduzierbare Build (5.9)
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - name: Tests
        run: |
          (cd packages/protocol && npm test)
          (cd packages/app && npm test)
          python3 scripts/check_innerhtml.py packages/app/src --ausnahmen scripts/innerhtml-ausnahmen.txt --streng
      - id: pages
        uses: actions/configure-pages@v5
      - name: Website zusammenstellen
        env:
          # Adresse dieser Auslieferung – Webseed des Torrents (5.3b)
          SPIEGEL_BASIS_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/build-site.sh site
      - name: Veroeffentlichte freedom.html und freedom-sw.js nachbauen
        # 5.9: Was hinausgeht, muss ein frischer Build desselben Commits bitgleich
        # ergeben – sonst wird nichts veroeffentlicht. Seit B-12c auch der Weck-Worker.
        run: bash scripts/repro-build.sh --vergleiche-ordner site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  spiegel:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.spiegeln
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # der erste Commit fuer die NIP-34-Ankuendigung (5.9b)
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: seite-archiv
      - run: mkdir seite && tar -xf seite-archiv/artifact.tar -C seite
      - name: Spiegel hochladen
        shell: bash  # mit pipefail – ein gescheiterter Upload faerbt den Job rot
        env:
          # Konten: docs/KONTEN.md (A1–A4); fehlt eines, wird dieser Spiegel uebersprungen
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          SPIEGEL_NSEC: ${{ secrets.SPIEGEL_NSEC }}
          BLOSSOM_SERVER: ${{ vars.BLOSSOM_SERVER }}
          ARWEAVE_JWK: ${{ secrets.ARWEAVE_JWK }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: npx --no-install tsx scripts/mirror/spiegeln.mts seite spiegel-ergebnis.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Repository per NIP-34 ankuendigen
        # 5.9b: Kind 30617 mit GitHub und – sobald in spiegel/quellen.json gesetzt – Radicle,
        # signiert mit dem Spiegel-Schluessel. Ohne SPIEGEL_NSEC uebersprungen.
        shell: bash
        env:
          SPIEGEL_NSEC: ${{ secrets.SPIEGEL_NSEC }}
          REPO_MAINTAINER: ${{ vars.REPO_MAINTAINER }}
        run: npx --no-install tsx scripts/mirror/repo-ankuendigung.mts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiegel-ergebnis
          path: spiegel-ergebnis.json
